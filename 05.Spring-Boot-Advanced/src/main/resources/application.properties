logging.level.org.springframework=INFO
app.name=in28Minutes
welcome.message=Welcome message from property file! Welcome to ${app.name}

basic.value=true
basic.message=Welcome to in28minutes
basic.number=200
spring.datasource.url=jdbc:h2:mem:testdb;NON_KEYWORDS=USER

# Disable H2 Console in production (enable per-profile if needed for dev)
spring.h2.console.enabled=false

# Restrict actuator endpoint exposure
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=when-authorized

# Suppress internal details in error responses
server.error.include-stacktrace=never
server.error.include-message=never
